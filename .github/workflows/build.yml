name: Upload EFI to Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Upload Release Asset
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Packaging EFIs 
        run: |
          zip -q -r Z590-AORUS-PRO-AX-macOS-Sonoma.zip ./Z590-AORUS-PRO-AX-macOS-Sonoma
          zip -q -r Z590-AORUS-PRO-AX-macOS-Sequoia.zip ./Z590-AORUS-PRO-AX-macOS-Sequoia
          zip -q -r Z590-AORUS-PRO-AX-macOS-Tahoe.zip ./Z590-AORUS-PRO-AX-macOS-Tahoe
          ls -l *.zip

      - name: Generate Release Notes
        id: release_notes
        run: |
          if [ -f "changelog.md" ]; then
            echo "Usando changelog.md existente."
            # O conteúdo do arquivo será usado no campo body_path abaixo
          else
            echo "changelog.md não encontrado. Gerando log de commits..."
            # Pega as mensagens dos commits desde a última tag
            git log $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD --oneline > auto_changelog.md
          fi

      - name: Upload Release Asset
        id: upload-release-asset 
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}   
          tag_name: ${{ github.ref_name }}    
          generate_release_notes: true 
          body_path: ${{ hashFiles('changelog.md') != '' && 'changelog.md' || '' }}
          files: |
            ./*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}